[package]
name = "flowio"
version = "0.1.1-alpha.25"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Single-threaded async runtime and TCP/UDP/SCTP/TLS transport library on Linux io_uring, with zero-allocation fast paths"
readme = "README.md"
keywords = ["async", "io-uring", "runtime", "networking"]
categories = ["asynchronous", "network-programming"]
exclude = ["tests/", "public-api.txt"]
repository = "https://github.com/BitFlockLabs/flowio"

[features]
# Dev-only: re-exports internal parsers for the out-of-source `fuzz/` crate.
# Off by default; does not change the real public API.
fuzzing = []

[dependencies]
io-uring = "0.7.11"
libc = "0.2.182"
rustls = { version = "0.23.38", default-features = false, features = ["std", "ring", "tls12"] }
sha2 = "0.10"

[dev-dependencies]
rcgen = "0.14"
static_assertions = "1.1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(miri)'] }
