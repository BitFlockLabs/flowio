[package]
name = "flowio"
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Single-threaded io_uring runtime for x86-64 Linux with Unix, TCP, UDP, SCTP, TLS client and DNS APIs, plus pooled I/O buffers"
readme = "README.md"
keywords = ["async", "io-uring", "runtime", "networking"]
categories = ["asynchronous", "network-programming"]
exclude = ["fixtures/fuzzing/", "tests/", "public-api.txt"]
repository = "https://github.com/BitFlockLabs/flowio"

[features]
# Dev-only: exposes internal parsers to the cargo-fuzz crate in `fuzz/` and
# fixture integration tests; with `test-support`, also fixture observation hooks.
# Off by default; not part of the supported public API.
fuzzing = []
# Dev-only: re-exports internal hooks for integration tests and benchmark harnesses.
# Off by default; not part of the supported public API.
test-support = []
# Dev-only: adds executor-local diagnostic counters.
# Implies the unsupported test-support facade used to snapshot and reset them.
diagnostic-counters = ["test-support"]

[dependencies]
io-uring = "0.7.13"
libc = "0.2.186"
rustls = { version = "0.23.42", default-features = false, features = ["std", "ring", "tls12"] }
sha2 = "0.11"

[dev-dependencies]
flowio = { path = ".", features = ["test-support"] }
rcgen = "0.14"
static_assertions = "1.1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(miri)'] }
