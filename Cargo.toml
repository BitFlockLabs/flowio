[package]
name = "flowio"
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Single-threaded async runtime and TCP/UDP/SCTP/TLS transport library on x86-64 Linux io_uring, with pooled allocation-avoiding fast paths"
readme = "README.md"
keywords = ["async", "io-uring", "runtime", "networking"]
categories = ["asynchronous", "network-programming"]
exclude = ["fixtures/fuzzing/", "tests/", "public-api.txt"]
repository = "https://github.com/BitFlockLabs/flowio"

[features]
# Dev-only: re-exports internal parsers for the out-of-source `fuzz/` crate.
# Off by default; does not change the real public API.
fuzzing = []
# Dev-only: re-exports internal hooks used by out-of-source tests/benches.
# Off by default; not part of the supported public API.
test-support = []
# Dev-only: adds executor-local counters for bounded diagnostic campaigns.
# Implies the unsupported test-support facade used to snapshot and reset them.
diagnostic-counters = ["test-support"]

[dependencies]
io-uring = "0.7.13"
libc = "0.2.186"
rustls = { version = "0.23.42", default-features = false, features = ["std", "ring", "tls12"] }
sha2 = "0.11"

[dev-dependencies]
flowio = { path = ".", features = ["test-support"] }
rcgen = "0.14"
static_assertions = "1.1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(miri)'] }
